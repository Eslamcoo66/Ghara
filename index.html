<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>دورة رمضانية</title>

<style>
body{
font-family:Arial;
background:#f0f2f5;
padding:20px;
direction:rtl;
}

h1{text-align:center;margin-bottom:20px;}

.group{
padding:15px;
margin-bottom:25px;
border-radius:12px;
color:#fff;
box-shadow:0 4px 10px rgba(0,0,0,0.15);
}

.group.A{background:linear-gradient(45deg,#4a90e2,#357abd);}
.group.B{background:linear-gradient(45deg,#27ae60,#1e8449);}
.group.E{background:linear-gradient(45deg,#f39c12,#d68910);}
.group.F{background:linear-gradient(45deg,#c0392b,#922b21);}

table{
width:100%;
border-collapse:collapse;
margin-top:10px;
background:#fff;
color:#000;
border-radius:8px;
overflow:hidden;
}

th,td{
border:1px solid #ddd;
padding:8px;
text-align:center;
}

/* أسماء الفرق */
th:first-child,td:first-child{
text-align:center;
font-weight:bold;
font-size:15px;
}

/* المتصدر */
.leader{
background:#fff3b0 !important;
font-weight:bold;
}

th{background:#ececec;}
tr:hover{background:#eaf2ff;}

button{
padding:6px 12px;
margin:3px;
cursor:pointer;
border-radius:6px;
border:none;
background:#333;
color:#fff;
font-size:13px;
}
button:hover{background:#111;}

input[type=number]{width:50px;}

.highlight{background:#fff89a;}
.lastUpdate{font-weight:bold;margin-bottom:6px;color:#fff;}
.hidden{display:none;}
</style>
</head>

<body>

<h1>دورة رمضانية</h1>

<div id="masterView" class="hidden"></div>
<div id="audienceView"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, onValue, set, push } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig={
apiKey:"YOUR_KEY",
authDomain:"gharaqa-ramadan.firebaseapp.com",
databaseURL:"https://gharaqa-ramadan-default-rtdb.firebaseio.com",
projectId:"gharaqa-ramadan",
storageBucket:"gharaqa-ramadan.firebasestorage.app",
messagingSenderId:"519550312575",
appId:"1:519550312575:web:9ea074b1c882b4a6ff1f4a"
};

const app=initializeApp(firebaseConfig);
const db=getDatabase(app);

const MASTER_PASSWORD="7890";

const groupsData={
A:["أصدقاء عبدالوهاب","شباب الشوكة","محلة كيل","أصدقاء حوش عيسي","شباب كوم البوص","الغراقة الغربية"],
B:["الشوكة الحاجر","الريف المصري","الصوالحية","اصدقاء محمد فؤاد","الزمالكاوية","البرنوجي"],
E:["ممتاز","كوم البوص","نجع العزايم","عزبة الست","أنصاف","أصدقاء اسامه الجارحي"],
F:["نجوم بطورس","الديابة","كوم القناطر","المحطة","الحريفة","الغراقة الشرقية"]
};

let isMaster=false;
if(location.search.includes("master")){
const pw=prompt("كلمة سر الماستر");
if(pw===MASTER_PASSWORD){
isMaster=true;
document.getElementById("masterView").classList.remove("hidden");
}
}

const masterDiv=document.getElementById("masterView");
const audienceDiv=document.getElementById("audienceView");

function createUI(){
for(let g in groupsData){

/* MASTER */
if(isMaster){
const div=document.createElement("div");
div.className="group "+g;
div.innerHTML=`
<h2>المجموعة ${g}</h2>

<table id="master-${g}">
<thead>
<tr>
<th>الفريق</th><th>لعب</th><th>فوز</th><th>تعادل</th><th>خسارة</th>
<th>+</th><th>-</th><th>فارق</th><th>نقاط</th>
</tr>
</thead><tbody></tbody></table>

<h4>إضافة نتيجة</h4>
<select id="t1-${g}"></select>
<input type="number" id="s1-${g}" value="0">
-
<input type="number" id="s2-${g}" value="0">
<select id="t2-${g}"></select>
<button onclick="addMatch('${g}')">إضافة</button>

<h4>المباريات</h4>
<table id="matches-${g}">
<thead>
<tr><th>فريق</th><th>أهداف</th><th>فريق</th><th>أهداف</th><th>تعديل</th><th>حذف</th></tr>
</thead><tbody></tbody></table>
`;
masterDiv.appendChild(div);

for(let t of groupsData[g]){
div.querySelector(`#t1-${g}`).add(new Option(t,t));
div.querySelector(`#t2-${g}`).add(new Option(t,t));
}
}

/* AUDIENCE */
const divA=document.createElement("div");
divA.className="group "+g;
divA.innerHTML=`
<h2>المجموعة ${g}</h2>
<div class="lastUpdate" id="update-${g}">آخر تحديث -</div>

<table id="aud-${g}">
<thead>
<tr>
<th>الفريق</th><th>لعب</th><th>فوز</th><th>تعادل</th><th>خسارة</th>
<th>+</th><th>-</th><th>فارق</th><th>نقاط</th>
</tr>
</thead><tbody></tbody></table>

<h4>النتائج</h4>
<table id="am-${g}">
<thead>
<tr><th>فريق</th><th>أهداف</th><th>فريق</th><th>أهداف</th></tr>
</thead><tbody></tbody></table>
`;
audienceDiv.appendChild(divA);

render(g);
}
}

/* إضافة */
window.addMatch=function(g){
const t1=document.getElementById(`t1-${g}`).value;
const t2=document.getElementById(`t2-${g}`).value;
const s1=parseInt(document.getElementById(`s1-${g}`).value)||0;
const s2=parseInt(document.getElementById(`s2-${g}`).value)||0;
if(t1===t2) return alert("نفس الفريق");
push(ref(db,"m/"+g),{t1,t2,s1,s2,time:Date.now()});
}

/* تعديل */
window.editMatch=function(g,k){
const s1=prompt("أهداف الفريق الأول");
const s2=prompt("أهداف الفريق الثاني");
if(s1===null||s2===null) return;
const old=lastData[g][k];
set(ref(db,"m/"+g+"/"+k),{
t1:old.t1,
t2:old.t2,
s1:parseInt(s1)||0,
s2:parseInt(s2)||0,
time:Date.now()
});
}

/* حذف */
window.delMatch=function(g,k){
if(confirm("حذف المباراة؟")){
set(ref(db,"m/"+g+"/"+k),null);
}
}

const lastData={};

function render(g){
const audBody=document.querySelector(`#aud-${g} tbody`);
const audM=document.querySelector(`#am-${g} tbody`);
const upd=document.getElementById(`update-${g}`);
const mastBody=isMaster?document.querySelector(`#master-${g} tbody`):null;
const mastM=isMaster?document.querySelector(`#matches-${g} tbody`):null;

onValue(ref(db,"m/"+g),snap=>{
const data=snap.val()||{};
lastData[g]=data;

const teams={};
let last=0;

for(let t of groupsData[g]){
teams[t]={p:0,w:0,d:0,l:0,gf:0,ga:0,gd:0,pts:0};
}

for(let k in data){
const m=data[k];
if(m.time>last) last=m.time;

const a=teams[m.t1],b=teams[m.t2];
a.p++;b.p++;
a.gf+=m.s1;a.ga+=m.s2;
b.gf+=m.s2;b.ga+=m.s1;

if(m.s1>m.s2){a.w++;a.pts+=3;b.l++;}
else if(m.s2>m.s1){b.w++;b.pts+=3;a.l++;}
else{a.d++;b.d++;a.pts++;b.pts++;}
}

for(let t in teams) teams[t].gd=teams[t].gf-teams[t].ga;

const sorted=Object.keys(teams).sort((a,b)=>{
if(teams[b].pts!==teams[a].pts) return teams[b].pts-teams[a].pts;
return teams[b].gd-teams[a].gd;
});

audBody.innerHTML="";
if(mastBody) mastBody.innerHTML="";

sorted.forEach((t,i)=>{
const d=teams[t];
const tr=document.createElement("tr");
if(i===0) tr.classList.add("leader");
tr.innerHTML=`
<td>${t}</td><td>${d.p}</td><td>${d.w}</td><td>${d.d}</td><td>${d.l}</td>
<td>${d.gf}</td><td>${d.ga}</td><td>${d.gd}</td><td>${d.pts}</td>`;
audBody.appendChild(tr);
if(mastBody) mastBody.appendChild(tr.cloneNode(true));
});

audM.innerHTML="";
if(mastM) mastM.innerHTML="";
const now=Date.now();

for(let k in data){
const m=data[k];
const tr=document.createElement("tr");
if(now-m.time<60000) tr.classList.add("highlight");
tr.innerHTML=`<td>${m.t1}</td><td>${m.s1}</td><td>${m.t2}</td><td>${m.s2}</td>`;
audM.appendChild(tr);

if(mastM){
const tr2=document.createElement("tr");
tr2.innerHTML=`
<td>${m.t1}</td><td>${m.s1}</td><td>${m.t2}</td><td>${m.s2}</td>
<td><button onclick="editMatch('${g}','${k}')">تعديل</button></td>
<td><button onclick="delMatch('${g}','${k}')">حذف</button></td>
`;
mastM.appendChild(tr2);
}
}

if(last){
const d=new Date(last);
upd.textContent=`آخر تحديث ${d.getHours()}:${d.getMinutes()}:${d.getSeconds()}`;
}
});
}

createUI();
</script>

</body>
</html>
